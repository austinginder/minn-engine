<script>
(function () {
	var root = document.documentElement;
	function paint(mode) { root.setAttribute('data-root-theme', mode); }
	try {
		var stored = localStorage.getItem('minn-theme');
		if (!stored) { localStorage.setItem('minn-theme', 'system'); stored = 'system'; }
		var pref = (stored === 'light' || stored === 'dark') ? stored : 'system';
		root.setAttribute('data-theme-pref', pref);
		if (pref === 'system' && window.matchMedia) {
			var mq = window.matchMedia('(prefers-color-scheme: light)');
			paint(mq.matches ? 'light' : 'dark');
			mq.addEventListener('change', function (e) {
				if (localStorage.getItem('minn-theme') !== 'system') { return; }
				paint(e.matches ? 'light' : 'dark');
			});
		} else {
			paint(pref === 'light' ? 'light' : 'dark');
		}
	} catch (e) {
		root.setAttribute('data-theme-pref', 'dark');
		paint('dark');
	}
})();
</script>
